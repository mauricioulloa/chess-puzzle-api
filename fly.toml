# Production deployment for chess.mauriulloa.com
#
# The puzzle database lives on a persistent volume rather than in the image,
# so a deploy ships only the binary and the data survives every release.

app = "chess-puzzle-api"
primary_region = "iad"

[build]

[env]
  PUZZLES_DB = "/data/puzzles-v3.db"
  API_DB = "/data/api.db"
  BIND_ADDR = "0.0.0.0:8080"
  ANONYMOUS_LIMIT = "30"
  # Fly's proxy sets the client address. Without this every request in the
  # world would look like it came from the proxy and share one rate limit.
  TRUST_PROXY_HEADERS = "true"
  RUST_LOG = "chess_puzzle_api=info"
  # Without this /mcp refuses every caller as a DNS-rebinding attempt.
  MCP_ALLOWED_HOSTS = "chess.mauriulloa.com,chess-puzzle-api.fly.dev"

[[mounts]]
  source = "puzzle_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Never stop: a freshly started machine has a cold page cache.
  auto_stop_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Enough because SQLite's per-connection caches are kept small and the OS
  # page cache does the caching (see src/db/pool.rs).
  memory = "512mb"
  cpus = 1
