# Production deployment for chess.mauriulloa.com
#
# The puzzle database is a 633 MB file on a persistent volume rather than part
# of the image: deploys then move a 12 MB binary instead of rebuilding and
# pushing the whole dataset, and the data survives every release.

app = "chess-puzzle-api"
# Santiago is not a Fly region; Sao Paulo is the closest one to Chile.
primary_region = "gru"

[build]

[env]
  PUZZLES_DB = "/data/puzzles.db"
  API_DB = "/data/api.db"
  BIND_ADDR = "0.0.0.0:8080"
  ANONYMOUS_LIMIT = "30"
  # Fly's proxy sets the client address. Without this every request in the
  # world would look like it came from the proxy and share one rate limit.
  TRUST_PROXY_HEADERS = "true"
  RUST_LOG = "chess_puzzle_api=info"
  # The MCP transport refuses Host headers it does not recognise, as
  # DNS-rebinding protection, and only knows the loopback names by default.
  # Without this the /mcp endpoint returns 403 to every caller.
  MCP_ALLOWED_HOSTS = "chess.mauriulloa.com,chess-puzzle-api.fly.dev"

[[mounts]]
  source = "puzzle_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Never stop: SQLite reads through the page cache, and a machine that has
  # just started has a cold one. Staying up is what keeps queries sub-millisecond.
  auto_stop_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB. The 1 GB here was paying for SQLite's per-connection page caches
  # (8 pooled connections at 32 MB each), not for the OS page cache, which is
  # evictable and simply uses whatever is free. With those caches cut to 2 MB
  # the working set fits, and measured end-to-end latency is unchanged: a
  # request is ~87 ms of network round trip and well under a millisecond of
  # query, so page-cache misses are invisible next to the wire.
  memory = "512mb"
  cpus = 1
