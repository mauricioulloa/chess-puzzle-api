[package]
name = "chess-puzzle-api"
version = "0.1.0"
edition = "2024"
authors = ["Mauri Ulloa <https://mauriulloa.com>"]
description = "An open-source HTTP and MCP API serving random chess puzzles by rating and theme, from the Lichess puzzle database"
license = "MIT"
repository = "https://github.com/mauricioulloa/chess-puzzle-api"
homepage = "https://mauriulloa.com"
readme = "README.md"
keywords = ["chess", "puzzles", "api", "lichess", "mcp"]
categories = ["games", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
futures-util = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
jiff = "0.2.37"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = { version = "0.10.3", features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shakmaty = "0.30.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
zstd = "0.14.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
